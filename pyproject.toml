[project]
name = "scriptorum"
version = "0.6.5"
description = "A text processor for game masters writing their own adventures, with pixel-perfect PDF output."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Scriptorum project" }]
# Exact versions: the Typst version is pinned (F7.8), so output never changes by surprise.
dependencies = [
    "PySide6==6.8.3",
    "typst==0.15.0",
    # F4.8 spell check: a pure-Python Hunspell (MIT), so no compiled library is needed.
    "spylls==0.1.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5"]

[project.scripts]
scriptorum = "scriptorum.app.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scriptorum*"]

[tool.setuptools.package-data]
scriptorum = ["ui/*.html", "ui/*.css", "ui/*.svg", "ui/dist/*.js", "bundled/**/*", "dictionaries/**/*", "examples/**/*", "licences/**/*"]
